<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ホイカメラ</title>
    <link rel="apple-touch-icon" href="/voice_shutter_camera/camera.png">
    <style>
        :root {
            --panel-w: 200px; /* 横画面時の操作パネル幅 */
        }
        * {
            box-sizing: border-box;
        }
        html, body {
            -webkit-text-size-adjust: 100%;
            height: 100%;
            overflow: hidden;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", Meiryo, Roboto, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding:
                max(env(safe-area-inset-top, 0px), 8px)
                max(env(safe-area-inset-right, 0px), 12px)
                max(env(safe-area-inset-bottom, 0px), 8px)
                max(env(safe-area-inset-left, 0px), 12px);
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        h1 {
            font-size: 1.1rem;
            margin: 0 0 4px;
        }
        .container {
            position: relative;
            width: 100%;
            max-width: 640px;
            background: #1e1e1e;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
        }
        /* 映像エリア（黒背景・ピンチ操作の受付領域） */
        .video-wrapper {
            width: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            touch-action: none;
        }
        /* 映像と同じ縦横比の枠（サイズはJSで計算）。ズームはこの枠の中でだけ表示 */
        .video-clip {
            position: relative;
            overflow: hidden;
            width: 100%;
            aspect-ratio: 16 / 9; /* 読み込み前の仮値。JSで上書き */
        }
        video {
            width: 100%;
            height: 100%;
            display: block;
            transform-origin: center center;
        }
        canvas {
            display: none;
        }
        .zoom-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            padding: 2px 8px;
            border-radius: 10px;
            background: rgba(0,0,0,0.6);
            color: #fff;
            font-size: 0.75rem;
            pointer-events: none;
        }
        .panel {
            display: flex;
            flex-direction: column;
        }
        .zoom-buttons {
            display: flex;
            gap: 6px;
            justify-content: center;
            padding: 4px 10px 0;
        }
        .zoom-buttons button {
            min-width: 44px;
            padding: 3px 8px;
            font-size: 0.8rem;
            border: 1px solid #444;
            border-radius: 14px;
            background: #2a2a2a;
            color: #e0e0e0;
            cursor: pointer;
        }
        .zoom-buttons button.on {
            background: #f5c518;
            border-color: #f5c518;
            color: #000;
            font-weight: bold;
        }
        /* 撮影した写真を並べるトレイ（軽量サムネイルのみ表示） */
        .gallery-tray {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding: 6px 10px;
            margin-top: 6px;
            background: #161616;
            min-height: 54px;
            align-items: center;
            border-top: 1px solid #333;
            border-bottom: 1px solid #333;
        }
        .thumbnail-item {
            position: relative;
            flex-shrink: 0;
            width: 40px;
            height: 40px;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid #555;
            cursor: pointer;
        }
        .thumbnail-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .thumbnail-item .num-badge {
            position: absolute;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            color: #fff;
            font-size: 0.6rem;
            padding: 0 3px;
            line-height: 1.3;
        }
        .gallery-empty {
            color: #666;
            font-size: 0.75rem;
            width: 100%;
            text-align: center;
        }
        .controls {
            padding: 8px 12px 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: center;
        }
        .status-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 4px;
            width: 100%;
            font-size: 0.75rem;
            color: #aaa;
        }
        .indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #555;
            margin-right: 4px;
        }
        .indicator.active {
            background-color: #4caf50;
            box-shadow: 0 0 6px #4caf50;
        }
        .btn-group {
            display: flex;
            gap: 6px;
            width: 100%;
        }
        .btn {
            display: inline-block;
            background-color: #007acc;
            color: white;
            border: none;
            padding: 8px 12px;
            font-size: 0.9rem;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            flex: 1;
        }
        .btn.active {
            background-color: #d32f2f;
        }
        .btn.save {
            background-color: #2e7d32;
        }
        .btn.danger {
            background-color: #d32f2f;
        }
        .btn.gray {
            background-color: #555;
        }
        .btn.disabled {
            background-color: #444;
            color: #888;
            pointer-events: none;
        }

        /* 写真確認・保存モーダル */
        .preview-container {
            position: fixed;
            inset: 0;
            background: rgba(18,18,18,0.96);
            z-index: 100;
            padding:
                max(env(safe-area-inset-top, 0px), 12px)
                max(env(safe-area-inset-right, 0px), 16px)
                max(env(safe-area-inset-bottom, 0px), 12px)
                max(env(safe-area-inset-left, 0px), 16px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            overflow-y: auto;
        }
        .preview-main {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 100%;
        }
        .preview-main h2 {
            font-size: 1rem;
            margin: 0 0 6px;
        }
        #modalImage {
            max-width: 100%;
            max-height: 50vh;
            max-height: 50dvh;
            border-radius: 8px;
            border: 1px solid #333;
            display: block;
        }
        .preview-info {
            margin-top: 4px;
            font-size: 0.75rem;
            color: #888;
        }
        .preview-side {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
            max-width: 320px;
        }
        .preview-side .btn {
            flex: none;
            width: 100%;
        }
        .preview-side .btn-group .btn {
            flex: 1;
            width: auto;
        }

        .flash {
            position: fixed;
            inset: 0;
            background: #fff;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.15s;
            z-index: 150;
        }
        .flash.on {
            opacity: 0.7;
            transition: none;
        }
        .toast {
            position: fixed;
            top: calc(env(safe-area-inset-top, 0px) + 10px);
            left: 50%;
            transform: translateX(-50%);
            max-width: 90vw;
            padding: 8px 14px;
            border-radius: 18px;
            background: rgba(0,0,0,0.85);
            color: #fff;
            font-size: 0.8rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            z-index: 200;
        }
        .toast.on {
            opacity: 1;
        }

        /* ===== 横画面レイアウト：左に映像、右に操作パネル ===== */
        @media (orientation: landscape) {
            h1 {
                display: none;
            }
            .container {
                flex-direction: row;
                max-width: none;
                height: 100%;
            }
            .video-wrapper {
                flex: 1 1 auto;
                min-width: 0;
                height: 100%;
            }
            .panel {
                flex: 0 0 var(--panel-w);
                width: var(--panel-w);
                justify-content: center;
                overflow-y: auto;
            }
            .zoom-buttons {
                padding: 4px 8px 0;
            }
            .zoom-buttons button {
                min-width: 40px;
                padding: 3px 8px;
            }
            .gallery-tray {
                flex-wrap: wrap;
                overflow-x: hidden;
                overflow-y: auto;
                max-height: 100px;
                padding: 6px 8px;
            }
            .controls {
                padding: 6px 8px 8px;
            }
            .status-bar {
                flex-direction: column;
            }
            .controls .btn-group {
                flex-direction: column;
            }
            .controls .btn {
                flex: none;
                width: 100%;
                padding: 7px 10px;
            }

            .preview-container {
                flex-direction: row;
                gap: 16px;
            }
            #modalImage {
                max-height: calc(100vh - 60px);
                max-height: calc(100dvh - 60px);
                max-width: calc(100vw - 290px);
            }
            .preview-main h2 {
                display: none;
            }
            .preview-side {
                width: 210px;
                flex: 0 0 210px;
            }
        }
    </style>
</head>
<body>

    <h1>ホイカメラ</h1>

    <div class="container" id="container">
        <div class="video-wrapper" id="videoWrapper">
            <div class="video-clip" id="videoClip">
                <video id="video" autoplay playsinline muted></video>
                <div class="zoom-badge" id="zoomBadge">×1.0</div>
            </div>
        </div>
        <canvas id="canvas"></canvas>

        <div class="panel" id="panel">
            <div class="zoom-buttons" id="zoomButtons">
                <button data-zoom="1" class="on">1×</button>
                <button data-zoom="2">2×</button>
                <button data-zoom="3">3×</button>
            </div>

            <!-- 撮影した写真のサムネイル一覧トレイ -->
            <div class="gallery-tray" id="galleryTray">
                <div class="gallery-empty" id="galleryEmpty">まだ写真がありません（「シャッター」と発声して連写）</div>
            </div>

            <div class="controls">
                <div class="status-bar">
                    <div><span id="micIndicator" class="indicator"></span>音声: <span id="micStatus">停止中</span></div>
                    <div>撮影: <span id="photoCount">0</span>/<span id="maxCount">30</span>枚</div>
                    <div>ズーム: <span id="zoomMode">-</span></div>
                </div>
                <div class="btn-group">
                    <button id="toggleMicBtn" class="btn">音声認識開始</button>
                    <button id="openReviewBtn" class="btn save disabled" onclick="openReview()">確認・保存へ</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 写真確認・保存モーダル -->
    <div class="preview-container" id="previewArea" style="display: none;">
        <div class="preview-main">
            <h2>撮影写真の確認 (<span id="modalCounter">1/1</span>)</h2>
            <img id="modalImage" alt="撮影画像">
            <div class="preview-info" id="modalInfo"></div>
        </div>
        <div class="preview-side">
            <button id="shareAllBtn" class="btn save" style="display:none;">全て共有/保存</button>
            <a id="downloadLink" class="btn" download="photo.jpg">この1枚をファイル保存</a>
            <div class="btn-group">
                <button class="btn gray" onclick="prevPhoto()">◀ 前へ</button>
                <button class="btn gray" onclick="nextPhoto()">次へ ▶</button>
            </div>
            <div class="btn-group">
                <button class="btn danger" onclick="deleteCurrentPhoto()">この1枚を削除</button>
                <button class="btn danger" onclick="deleteAllPhotos()">全て削除</button>
            </div>
            <button class="btn gray" onclick="closeReview()">撮影に戻る</button>
        </div>
    </div>

    <div id="flash" class="flash"></div>
    <div id="toast" class="toast"></div>

    <script>
        const video = document.getElementById('video');
        const videoWrapper = document.getElementById('videoWrapper');
        const videoClip = document.getElementById('videoClip');
        const panel = document.getElementById('panel');
        const canvas = document.getElementById('canvas');
        const previewArea = document.getElementById('previewArea');
        const modalImage = document.getElementById('modalImage');
        const modalInfo = document.getElementById('modalInfo');
        const modalCounter = document.getElementById('modalCounter');
        const downloadLink = document.getElementById('downloadLink');
        const shareAllBtn = document.getElementById('shareAllBtn');
        const toggleMicBtn = document.getElementById('toggleMicBtn');
        const openReviewBtn = document.getElementById('openReviewBtn');
        const micStatus = document.getElementById('micStatus');
        const micIndicator = document.getElementById('micIndicator');
        const flash = document.getElementById('flash');
        const toast = document.getElementById('toast');
        const zoomBadge = document.getElementById('zoomBadge');
        const zoomButtons = document.getElementById('zoomButtons');
        const zoomMode = document.getElementById('zoomMode');
        const galleryTray = document.getElementById('galleryTray');
        const galleryEmpty = document.getElementById('galleryEmpty');
        const photoCount = document.getElementById('photoCount');
        const maxCountEl = document.getElementById('maxCount');

        const TRIGGER_WORDS = ['ホイ','シャッター', 'チーズ', '撮って', '写真','カシャ','パシャ'];
        const COOLDOWN_MS = 700;       // 連続撮影しやすい短めの間隔
        const MAX_DIGITAL_ZOOM = 4.0;
        const MAX_PHOTOS = 30;         // メモリ保護のための上限枚数
        const THUMB_MAX_SIDE = 120;    // サムネイルの長辺(px)

        let recognition = null;
        let isListening = false;
        let lastShot = 0;
        let firedCounts = {};          // 認識結果ごとに「撮影済みのキーワード数」を記録
        let stream = null;
        let track = null;
        let wakeLock = null;
        let toastTimer = null;
        let photoSeq = 0;

        // 撮影した写真（blob=原寸、thumbUrl=軽量サムネイル）
        let capturedPhotos = [];
        let currentModalIndex = 0;

        let nativeZoom = null;
        let currentZoom = 1.0;
        let pinchStartDist = null;
        let pinchStartZoom = 1.0;
        let nativeApplying = false;
        let nativePending = null;

        maxCountEl.textContent = MAX_PHOTOS;

        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('on');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('on'), 2500);
        }

        // 映像全体が（縦画面でも横画面でも）切れずに収まるよう、枠のサイズを計算する
        function fitVideo() {
            const vw = video.videoWidth;
            const vh = video.videoHeight;
            if (!vw || !vh) return;

            const isLandscape = window.matchMedia('(orientation: landscape)').matches;
            const bodyStyle = getComputedStyle(document.body);
            const padX = parseFloat(bodyStyle.paddingLeft) + parseFloat(bodyStyle.paddingRight);
            const padY = parseFloat(bodyStyle.paddingTop) + parseFloat(bodyStyle.paddingBottom);
            const viewW = document.documentElement.clientWidth;
            const viewH = window.innerHeight;

            let availW, availH;
            if (isLandscape) {
                const panelW = panel.getBoundingClientRect().width || 200;
                availW = viewW - padX - panelW;
                availH = viewH - padY;
            } else {
                availW = Math.min(viewW - padX, 640);
                availH = (viewH - padY) * 0.45;
            }

            const s = Math.min(availW / vw, availH / vh);
            videoClip.style.width = Math.max(1, Math.floor(vw * s)) + 'px';
            videoClip.style.height = Math.max(1, Math.floor(vh * s)) + 'px';
            videoClip.style.aspectRatio = 'auto';
        }

        async function initCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: { ideal: 'environment' },
                        width: { ideal: 3840 },
                        height: { ideal: 2160 }
                    },
                    audio: false
                });
                video.srcObject = stream;
                track = stream.getVideoTracks()[0];
                detectNativeZoom();

                video.addEventListener('loadedmetadata', fitVideo);
                video.addEventListener('resize', fitVideo); // 画面回転で映像サイズが変わったとき
                if (video.readyState >= 1) fitVideo();
            } catch (err) {
                alert('カメラへのアクセスが拒否されたか、利用できません。');
                console.error(err);
            }
        }

        function detectNativeZoom() {
            try {
                const caps = track.getCapabilities ? track.getCapabilities() : {};
                if (caps.zoom && typeof caps.zoom.max === 'number' && caps.zoom.max > caps.zoom.min) {
                    nativeZoom = { min: caps.zoom.min, max: caps.zoom.max };
                    zoomMode.textContent = '光学';
                    return;
                }
            } catch (e) {
                console.warn(e);
            }
            nativeZoom = null;
            zoomMode.textContent = 'デジタル';
        }

        function maxZoom() {
            return nativeZoom ? nativeZoom.max : MAX_DIGITAL_ZOOM;
        }
        function minZoom() {
            return nativeZoom ? nativeZoom.min : 1.0;
        }

        function setZoom(z) {
            z = Math.min(maxZoom(), Math.max(minZoom(), z));
            currentZoom = z;
            zoomBadge.textContent = '×' + z.toFixed(1);

            if (nativeZoom) {
                applyNativeZoom(z);
            } else {
                video.style.transform = `scale(${z})`;
            }

            zoomButtons.querySelectorAll('button').forEach(b => {
                b.classList.toggle('on', Math.abs(parseFloat(b.dataset.zoom) - z) < 0.05);
            });
        }

        async function applyNativeZoom(z) {
            if (nativeApplying) {
                nativePending = z;
                return;
            }
            nativeApplying = true;
            try {
                await track.applyConstraints({ advanced: [{ zoom: z }] });
            } catch (e) {
                console.warn('ネイティブズーム失敗:', e);
                nativeZoom = null;
                zoomMode.textContent = 'デジタル';
                video.style.transform = `scale(${Math.min(z, MAX_DIGITAL_ZOOM)})`;
            }
            nativeApplying = false;
            if (nativePending !== null && nativeZoom) {
                const next = nativePending;
                nativePending = null;
                applyNativeZoom(next);
            }
        }

        function getTouchDistance(touches) {
            const dx = touches[0].clientX - touches[1].clientX;
            const dy = touches[0].clientY - touches[1].clientY;
            return Math.sqrt(dx * dx + dy * dy);
        }

        function setupZoom() {
            videoWrapper.addEventListener('touchstart', (e) => {
                if (e.touches.length === 2) {
                    e.preventDefault();
                    pinchStartDist = getTouchDistance(e.touches);
                    pinchStartZoom = currentZoom;
                }
            }, { passive: false });

            videoWrapper.addEventListener('touchmove', (e) => {
                if (e.touches.length === 2 && pinchStartDist) {
                    e.preventDefault();
                    const ratio = getTouchDistance(e.touches) / pinchStartDist;
                    setZoom(pinchStartZoom * ratio);
                }
            }, { passive: false });

            const endPinch = (e) => {
                if (e.touches.length < 2) pinchStartDist = null;
            };
            videoWrapper.addEventListener('touchend', endPinch);
            videoWrapper.addEventListener('touchcancel', endPinch);

            ['gesturestart', 'gesturechange', 'gestureend'].forEach(name => {
                document.addEventListener(name, (e) => e.preventDefault(), { passive: false });
            });
            document.addEventListener('touchmove', (e) => {
                if (e.touches.length > 1) e.preventDefault();
            }, { passive: false });

            zoomButtons.addEventListener('click', (e) => {
                const btn = e.target.closest('button');
                if (btn) setZoom(parseFloat(btn.dataset.zoom));
            });

            videoWrapper.addEventListener('wheel', (e) => {
                e.preventDefault();
                setZoom(currentZoom + (e.deltaY < 0 ? 0.2 : -0.2));
            }, { passive: false });

            // 画面の向き・サイズが変わったら枠を再計算
            window.addEventListener('resize', fitVideo);
            window.addEventListener('orientationchange', () => {
                setTimeout(fitVideo, 150);
                setTimeout(fitVideo, 500); // iOSは回転直後にサイズが確定しないことがあるため再実行
            });
        }

        // 軽量サムネイル（dataURL）を作る
        function makeThumb(srcCanvas) {
            const s = Math.min(1, THUMB_MAX_SIDE / Math.max(srcCanvas.width, srcCanvas.height));
            const t = document.createElement('canvas');
            t.width = Math.max(1, Math.round(srcCanvas.width * s));
            t.height = Math.max(1, Math.round(srcCanvas.height * s));
            t.getContext('2d').drawImage(srcCanvas, 0, 0, t.width, t.height);
            return t.toDataURL('image/jpeg', 0.7);
        }

        // 連続撮影：プレビューは出さず、配列に溜める
        function takePhoto() {
            if (!video.videoWidth) return;
            if (capturedPhotos.length >= MAX_PHOTOS) {
                showToast(`上限${MAX_PHOTOS}枚に達しました。保存してから削除してください`);
                return;
            }

            const vw = video.videoWidth;
            const vh = video.videoHeight;
            const ctx = canvas.getContext('2d');

            if (!nativeZoom && currentZoom > 1.0) {
                const cw = Math.round(vw / currentZoom);
                const ch = Math.round(vh / currentZoom);
                const cx = Math.round((vw - cw) / 2);
                const cy = Math.round((vh - ch) / 2);
                canvas.width = cw;
                canvas.height = ch;
                ctx.drawImage(video, cx, cy, cw, ch, 0, 0, cw, ch);
            } else {
                canvas.width = vw;
                canvas.height = vh;
                ctx.drawImage(video, 0, 0, vw, vh);
            }

            // canvasが次の撮影で書き換わる前に、サイズとサムネイルを確定させる
            const width = canvas.width;
            const height = canvas.height;
            const thumbUrl = makeThumb(canvas);
            const filename = `photo_${timestamp()}_${String(++photoSeq).padStart(3, '0')}.jpg`;

            canvas.toBlob((blob) => {
                if (!blob) return;
                capturedPhotos.push({
                    blob: blob,
                    url: URL.createObjectURL(blob),
                    thumbUrl: thumbUrl,
                    width: width,
                    height: height,
                    filename: filename
                });
                updateGalleryUI();
            }, 'image/jpeg', 0.95);

            flash.classList.add('on');
            setTimeout(() => flash.classList.remove('on'), 100);
        }

        // サムネイル一覧とカウンタの更新
        function updateGalleryUI() {
            const n = capturedPhotos.length;
            photoCount.textContent = n;
            shareAllBtn.textContent = `全${n}枚を共有/保存`;
            galleryEmpty.style.display = n > 0 ? 'none' : 'block';
            openReviewBtn.classList.toggle('disabled', n === 0);

            galleryTray.querySelectorAll('.thumbnail-item').forEach(item => item.remove());

            capturedPhotos.forEach((photo, idx) => {
                const thumb = document.createElement('div');
                thumb.className = 'thumbnail-item';

                const img = document.createElement('img');
                img.src = photo.thumbUrl;
                img.alt = '';
                const badge = document.createElement('div');
                badge.className = 'num-badge';
                badge.textContent = idx + 1;

                thumb.appendChild(img);
                thumb.appendChild(badge);
                thumb.addEventListener('click', () => openReview(idx));
                galleryTray.appendChild(thumb);
            });
            galleryTray.scrollLeft = galleryTray.scrollWidth;
            galleryTray.scrollTop = galleryTray.scrollHeight;
        }

        function openReview(index = 0) {
            if (capturedPhotos.length === 0) return;
            currentModalIndex = index;
            showModalPhoto();
            previewArea.style.display = 'flex';
        }

        function closeReview() {
            previewArea.style.display = 'none';
            modalImage.removeAttribute('src'); // 原寸画像のデコードメモリを解放
        }

        function showModalPhoto() {
            const photo = capturedPhotos[currentModalIndex];
            modalImage.src = photo.url;
            modalInfo.textContent = `${photo.width}×${photo.height}px ／ ${(photo.blob.size / 1024 / 1024).toFixed(1)}MB`;
            modalCounter.textContent = `${currentModalIndex + 1} / ${capturedPhotos.length}`;
            downloadLink.href = photo.url;
            downloadLink.download = photo.filename;
        }

        function nextPhoto() {
            if (capturedPhotos.length === 0) return;
            currentModalIndex = (currentModalIndex + 1) % capturedPhotos.length;
            showModalPhoto();
        }

        function prevPhoto() {
            if (capturedPhotos.length === 0) return;
            currentModalIndex = (currentModalIndex - 1 + capturedPhotos.length) % capturedPhotos.length;
            showModalPhoto();
        }

        function deleteCurrentPhoto() {
            if (capturedPhotos.length === 0) return;
            URL.revokeObjectURL(capturedPhotos[currentModalIndex].url);
            capturedPhotos.splice(currentModalIndex, 1);
            updateGalleryUI();

            if (capturedPhotos.length === 0) {
                closeReview();
            } else {
                currentModalIndex = Math.min(currentModalIndex, capturedPhotos.length - 1);
                showModalPhoto();
            }
        }

        function deleteAllPhotos() {
            if (capturedPhotos.length === 0) return;
            if (!confirm(`撮影した${capturedPhotos.length}枚をすべて削除します。保存済みですか？`)) return;
            capturedPhotos.forEach(p => URL.revokeObjectURL(p.url));
            capturedPhotos = [];
            updateGalleryUI();
            closeReview();
        }

        function timestamp() {
            const d = new Date();
            const p = (n) => String(n).padStart(2, '0');
            return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
        }

        // 全写真をまとめて共有シートへ（「○枚の画像を保存」で写真アプリに入る）
        function setupShare() {
            if (!navigator.share || !navigator.canShare) return;
            const testFile = new File([new Blob(['x'], { type: 'image/jpeg' })], 'test.jpg', { type: 'image/jpeg' });
            if (!navigator.canShare({ files: [testFile] })) return;

            shareAllBtn.style.display = 'block';
            shareAllBtn.addEventListener('click', async () => {
                if (capturedPhotos.length === 0) return;
                const files = capturedPhotos.map(p => new File([p.blob], p.filename, { type: 'image/jpeg' }));
                if (!navigator.canShare({ files })) {
                    alert('この枚数は一度に共有できません。「この1枚をファイル保存」を使うか、削除して枚数を減らしてください。');
                    return;
                }
                try {
                    await navigator.share({ files });
                } catch (e) {
                    if (e.name !== 'AbortError') console.error(e);
                }
            });
        }

        function setStoppedUI() {
            isListening = false;
            micStatus.textContent = '停止中';
            micIndicator.classList.remove('active');
            toggleMicBtn.textContent = '音声認識開始';
            toggleMicBtn.classList.remove('active');
        }

        // 発話中のトリガーワードの数を数える（「シャッター シャッター」で2と数える）
        function countTriggers(text) {
            let n = 0;
            for (const w of TRIGGER_WORDS) {
                let idx = 0;
                while ((idx = text.indexOf(w, idx)) !== -1) {
                    n++;
                    idx += w.length;
                }
            }
            return n;
        }

        function setupSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert('お使いのブラウザは音声認識に対応していません。');
                toggleMicBtn.style.display = 'none';
                return;
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'ja-JP';
            recognition.continuous = true;
            recognition.interimResults = true;

            recognition.onstart = () => {
                firedCounts = {};
            };

            recognition.onresult = (event) => {
                // 確認画面を開いている間は撮影しない
                const reviewing = previewArea.style.display !== 'none';

                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript.trim();
                    console.log('認識ワード:', transcript);

                    const count = countTriggers(transcript);
                    const fired = firedCounts[i] || 0;

                    // 同じ発話内でキーワードが増えたときだけ新しい撮影として扱う
                    if (count > fired) {
                        firedCounts[i] = count;
                        const now = Date.now();
                        if (!reviewing && now - lastShot > COOLDOWN_MS) {
                            lastShot = now;
                            takePhoto();
                        }
                    }
                }
            };

            recognition.onerror = (event) => {
                console.error('音声認識エラー:', event.error);
                if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
                    setStoppedUI();
                    alert('マイクまたは音声認識の使用が許可されていません。\n設定アプリでSafariのマイク許可と、「設定 > 一般 > キーボード > 音声入力」がオンか確認してください。');
                }
            };

            recognition.onend = () => {
                if (isListening) {
                    setTimeout(() => {
                        if (!isListening) return;
                        try {
                            recognition.start();
                        } catch (e) {
                            console.error(e);
                        }
                    }, 300);
                }
            };
        }

        toggleMicBtn.addEventListener('click', () => {
            if (!recognition) return;

            if (!isListening) {
                try {
                    recognition.start();
                    isListening = true;
                    micStatus.textContent = '待機中...';
                    micIndicator.classList.add('active');
                    toggleMicBtn.textContent = '音声認識停止';
                    toggleMicBtn.classList.add('active');
                } catch (e) {
                    console.error(e);
                }
            } else {
                setStoppedUI();
                recognition.stop();
            }
        });

        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (e) {
                console.warn('Wake Lock取得失敗:', e);
            }
        }
        // アプリを閉じる／別アプリへ切り替える／画面ロックしたときに音声認識を停止する
        let stoppedByHide = false;

        function stopListening() {
            if (!isListening) return false;
            setStoppedUI(); // 先に isListening を false にして、onend での自動再開を防ぐ
            try {
                recognition.abort();
            } catch (e) {
                console.warn(e);
            }
            return true;
        }

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden') {
                if (stopListening()) stoppedByHide = true;
            } else {
                requestWakeLock();
                if (stoppedByHide) {
                    stoppedByHide = false;
                    showToast('音声認識を停止しました。再開は「音声認識開始」を押してください');
                }
            }
        });

        window.addEventListener('pagehide', () => {
            stopListening();
            if (stream) stream.getTracks().forEach(t => t.stop());
        });

        // 一部のブラウザでページが凍結される場合にも停止
        document.addEventListener('freeze', stopListening);

        initCamera();
        setupZoom();
        setupShare();
        setupSpeechRecognition();
        requestWakeLock();
    </script>
</body>
</html>
