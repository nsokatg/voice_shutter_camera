<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音声シャッターカメラ</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", Meiryo, Roboto, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            font-size: 1.4rem;
            margin-bottom: 10px;
        }
        .container {
            position: relative;
            width: 100%;
            max-width: 640px;
            background: #1e1e1e;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        video, canvas {
            width: 100%;
            display: block;
            background: #000;
        }
        canvas {
            display: none;
        }
        .controls {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            width: 100%;
            font-size: 0.9rem;
            color: #aaa;
        }
        .indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #555;
            margin-right: 5px;
        }
        .indicator.active {
            background-color: #4caf50;
            box-shadow: 0 0 8px #4caf50;
        }
        .btn {
            display: inline-block;
            background-color: #007acc;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #005999;
        }
        .btn.active {
            background-color: #d32f2f;
        }
        .btn.save {
            background-color: #2e7d32;
            margin-top: 10px;
        }
        .preview-container {
            margin-top: 20px;
            width: 100%;
            max-width: 640px;
        }
        .preview-container h2 {
            font-size: 1.1rem;
            margin-bottom: 8px;
        }
        #photoPreview {
            width: 100%;
            border-radius: 8px;
            border: 1px solid #333;
            display: block;
        }
        .flash {
            position: fixed;
            inset: 0;
            background: #fff;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.15s;
        }
        .flash.on {
            opacity: 0.7;
            transition: none;
        }
    </style>
</head>
<body>

    <h1>音声シャッターカメラ</h1>

    <div class="container">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>
        <div class="controls">
            <div class="status-bar">
                <div><span id="micIndicator" class="indicator"></span>音声認識: <span id="micStatus">停止中</span></div>
                <div>認識ワード: 「シャッター」「チーズ」「撮って」「写真」</div>
            </div>
            <button id="toggleMicBtn" class="btn">音声認識開始</button>
        </div>
    </div>

    <div class="preview-container" id="previewArea" style="display: none;">
        <h2>撮影プレビュー</h2>
        <img id="photoPreview" alt="撮影画像">
        <a id="downloadLink" class="btn save" download="photo.jpg">画像を保存する</a>
    </div>

    <div id="flash" class="flash"></div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const photoPreview = document.getElementById('photoPreview');
        const previewArea = document.getElementById('previewArea');
        const downloadLink = document.getElementById('downloadLink');
        const toggleMicBtn = document.getElementById('toggleMicBtn');
        const micStatus = document.getElementById('micStatus');
        const micIndicator = document.getElementById('micIndicator');
        const flash = document.getElementById('flash');

        // 画面表示と実際のトリガーを同じ配列に統一
        const TRIGGER_WORDS = ['シャッター', 'チーズ', '撮って', '写真'];
        const COOLDOWN_MS = 2000;

        let recognition = null;
        let isListening = false;
        let lastShot = 0;
        let stream = null;

        // 1. カメラ起動（外カメラを優先。なければ自動で別のカメラにフォールバック）
        async function initCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: { ideal: 'environment' },
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                });
                video.srcObject = stream;
            } catch (err) {
                alert('カメラへのアクセスが拒否されたか、利用できません。');
                console.error(err);
            }
        }

        // 2. 写真撮影処理
        function takePhoto() {
            if (!video.videoWidth) return; // カメラ未準備
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
            photoPreview.src = dataUrl;
            previewArea.style.display = 'block';
            downloadLink.href = dataUrl;

            // シャッター演出（画面を短く白くフラッシュ）
            flash.classList.add('on');
            setTimeout(() => flash.classList.remove('on'), 100);
        }

        // 音声認識の停止状態をUIに反映
        function setStoppedUI() {
            isListening = false;
            micStatus.textContent = '停止中';
            micIndicator.classList.remove('active');
            toggleMicBtn.textContent = '音声認識開始';
            toggleMicBtn.classList.remove('active');
        }

        // 3. 音声認識の設定 (Web Speech API)
        function setupSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert('お使いのブラウザは音声認識に対応していません（Google Chromeなどを推奨します）。');
                toggleMicBtn.style.display = 'none';
                return;
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'ja-JP';
            recognition.continuous = true;
            recognition.interimResults = false;

            recognition.onresult = (event) => {
                const last = event.results.length - 1;
                const transcript = event.results[last][0].transcript.trim();
                console.log('認識ワード:', transcript);

                const now = Date.now();
                // キーワード一致 かつ クールダウン経過後のみ撮影
                if (TRIGGER_WORDS.some(word => transcript.includes(word)) && now - lastShot > COOLDOWN_MS) {
                    lastShot = now;
                    takePhoto();
                }
            };

            recognition.onerror = (event) => {
                console.error('音声認識エラー:', event.error);
                // 許可拒否など、再試行しても無駄なエラーでは停止状態に戻す
                if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
                    setStoppedUI();
                    alert('マイクの使用が許可されていません。ブラウザの設定を確認してください。');
                }
            };

            recognition.onend = () => {
                // 意図せず停止した場合のみ再開（許可拒否時は isListening が false なので再開しない）
                if (isListening) {
                    setTimeout(() => {
                        if (!isListening) return;
                        try {
                            recognition.start();
                        } catch (e) {
                            console.error(e);
                        }
                    }, 300);
                }
            };
        }

        // 音声認識のトグルボタン
        toggleMicBtn.addEventListener('click', () => {
            if (!recognition) return;

            if (!isListening) {
                try {
                    recognition.start();
                    isListening = true;
                    micStatus.textContent = '待機中...';
                    micIndicator.classList.add('active');
                    toggleMicBtn.textContent = '音声認識停止';
                    toggleMicBtn.classList.add('active');
                } catch (e) {
                    console.error(e);
                }
            } else {
                setStoppedUI();
                recognition.stop();
            }
        });

        // ページを離れるときにカメラを解放
        window.addEventListener('pagehide', () => {
            if (stream) stream.getTracks().forEach(t => t.stop());
        });

        // 初期化実行
        initCamera();
        setupSpeechRecognition();
    </script>
</body>
</html>
