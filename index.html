<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>カシャカメラ</title>
    <link rel="apple-touch-icon" href="/voice_shutter_camera/camera.png">
    <style>
        :root {
            --panel-w: 170px; /* 横画面時の操作パネル幅 */
        }
        * {
            box-sizing: border-box;
        }
        html, body {
            -webkit-text-size-adjust: 100%;
            height: 100%;
            overflow: hidden;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", Meiryo, Roboto, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding:
                max(env(safe-area-inset-top, 0px), 8px)
                max(env(safe-area-inset-right, 0px), 12px)
                max(env(safe-area-inset-bottom, 0px), 8px)
                max(env(safe-area-inset-left, 0px), 12px);
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        h1 {
            font-size: 1.1rem;
            margin: 0 0 6px;
        }
        .container {
            position: relative;
            width: 100%;
            max-width: 640px;
            background: #1e1e1e;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
        }
        /* 映像エリア（黒背景・ピンチ操作の受付領域） */
        .video-wrapper {
            width: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            touch-action: none;
        }
        /* 映像と同じ縦横比の枠（サイズはJSで計算）。ズームはこの枠の中でだけ表示 */
        .video-clip {
            position: relative;
            overflow: hidden;
            width: 100%;
            aspect-ratio: 16 / 9; /* 読み込み前の仮値。JSで上書き */
        }
        video {
            width: 100%;
            height: 100%;
            display: block;
            transform-origin: center center;
        }
        canvas {
            display: none;
        }
        .zoom-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            padding: 2px 8px;
            border-radius: 10px;
            background: rgba(0,0,0,0.6);
            color: #fff;
            font-size: 0.75rem;
            pointer-events: none;
        }
        .panel {
            display: flex;
            flex-direction: column;
        }
        .zoom-buttons {
            display: flex;
            gap: 6px;
            justify-content: center;
            padding: 6px 10px 0;
        }
        .zoom-buttons button {
            min-width: 42px;
            padding: 4px 10px;
            font-size: 0.85rem;
            border: 1px solid #444;
            border-radius: 14px;
            background: #2a2a2a;
            color: #e0e0e0;
            cursor: pointer;
        }
        .zoom-buttons button.on {
            background: #f5c518;
            border-color: #f5c518;
            color: #000;
            font-weight: bold;
        }
        .controls {
            padding: 8px 12px 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: center;
        }
        .status-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 4px;
            width: 100%;
            font-size: 0.75rem;
            color: #aaa;
        }
        .indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #555;
            margin-right: 4px;
        }
        .indicator.active {
            background-color: #4caf50;
            box-shadow: 0 0 6px #4caf50;
        }
        .btn {
            display: inline-block;
            background-color: #007acc;
            color: white;
            border: none;
            padding: 8px 16px;
            font-size: 0.9rem;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            width: 100%;
            text-align: center;
        }
        .btn.active {
            background-color: #d32f2f;
        }
        .btn.save {
            background-color: #2e7d32;
        }
        .btn.gray {
            background: #555;
        }
        /* 撮影プレビュー（モーダル） */
        .preview-container {
            position: fixed;
            inset: 0;
            background: rgba(18,18,18,0.96);
            z-index: 100;
            padding: max(env(safe-area-inset-top, 0px), 12px) max(env(safe-area-inset-right, 0px), 16px) max(env(safe-area-inset-bottom, 0px), 12px) max(env(safe-area-inset-left, 0px), 16px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            overflow-y: auto;
        }
        .preview-main {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 100%;
        }
        .preview-main h2 {
            font-size: 1rem;
            margin: 0 0 6px;
        }
        #photoPreview {
            max-width: 100%;
            max-height: 55vh;
            max-height: 55dvh;
            border-radius: 8px;
            border: 1px solid #333;
            display: block;
            -webkit-touch-callout: default;
            -webkit-user-select: auto;
            user-select: auto;
        }
        .preview-info {
            margin-top: 4px;
            font-size: 0.75rem;
            color: #888;
        }
        .preview-side {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            max-width: 320px;
        }
        .flash {
            position: fixed;
            inset: 0;
            background: #fff;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.15s;
        }
        .flash.on {
            opacity: 0.7;
            transition: none;
        }

        /* ===== 横画面レイアウト：左に映像、右に操作パネル ===== */
        @media (orientation: landscape) {
            h1 {
                display: none;
            }
            .container {
                flex-direction: row;
                max-width: none;
                height: 100%;
            }
            .video-wrapper {
                flex: 1 1 auto;
                min-width: 0;
                height: 100%;
            }
            .panel {
                flex: 0 0 var(--panel-w);
                width: var(--panel-w);
                justify-content: center;
                overflow-y: auto;
            }
            .zoom-buttons {
                padding: 6px 8px 0;
            }
            .zoom-buttons button {
                min-width: 40px;
                padding: 4px 8px;
            }
            .controls {
                padding: 8px 10px;
            }
            .status-bar {
                flex-direction: column;
            }

            .preview-container {
                flex-direction: row;
                gap: 16px;
            }
            #photoPreview {
                max-height: calc(100vh - 60px);
                max-height: calc(100dvh - 60px);
                max-width: calc(100vw - 280px);
            }
            .preview-main h2 {
                display: none;
            }
            .preview-side {
                width: 200px;
                flex: 0 0 200px;
            }
        }
    </style>
</head>
<body>

    <h1>カシャカメラ</h1>

    <div class="container" id="container">
        <div class="video-wrapper" id="videoWrapper">
            <div class="video-clip" id="videoClip">
                <video id="video" autoplay playsinline muted></video>
                <div class="zoom-badge" id="zoomBadge">×1.0</div>
            </div>
        </div>
        <canvas id="canvas"></canvas>

        <div class="panel" id="panel">
            <div class="zoom-buttons" id="zoomButtons">
                <button data-zoom="1" class="on">1×</button>
                <button data-zoom="2">2×</button>
                <button data-zoom="3">3×</button>
            </div>

            <div class="controls">
                <div class="status-bar">
                    <div><span id="micIndicator" class="indicator"></span>音声: <span id="micStatus">停止中</span></div>
                    <div>解像度: <span id="resInfo">-</span></div>
                    <div>ズーム: <span id="zoomMode">-</span></div>
                </div>
                <button id="toggleMicBtn" class="btn">音声認識開始</button>
            </div>
        </div>
    </div>

    <!-- 撮影プレビュー（モーダル） -->
    <div class="preview-container" id="previewArea" style="display: none;">
        <div class="preview-main">
            <h2>撮影プレビュー</h2>
            <img id="photoPreview" alt="撮影画像">
            <div class="preview-info" id="photoInfo"></div>
        </div>
        <div class="preview-side">
            <button id="shareBtn" class="btn save" style="display:none;">共有/保存</button>
            <a id="downloadLink" class="btn" download="photo.jpg">ファイル保存</a>
            <button class="btn gray" onclick="closePreview()">閉じる（戻る）</button>
        </div>
    </div>

    <div id="flash" class="flash"></div>

    <script>
        const video = document.getElementById('video');
        const videoWrapper = document.getElementById('videoWrapper');
        const videoClip = document.getElementById('videoClip');
        const container = document.getElementById('container');
        const panel = document.getElementById('panel');
        const canvas = document.getElementById('canvas');
        const photoPreview = document.getElementById('photoPreview');
        const photoInfo = document.getElementById('photoInfo');
        const previewArea = document.getElementById('previewArea');
        const downloadLink = document.getElementById('downloadLink');
        const shareBtn = document.getElementById('shareBtn');
        const toggleMicBtn = document.getElementById('toggleMicBtn');
        const micStatus = document.getElementById('micStatus');
        const micIndicator = document.getElementById('micIndicator');
        const flash = document.getElementById('flash');
        const zoomBadge = document.getElementById('zoomBadge');
        const zoomButtons = document.getElementById('zoomButtons');
        const resInfo = document.getElementById('resInfo');
        const zoomMode = document.getElementById('zoomMode');

        const TRIGGER_WORDS = ['シャッター', 'チーズ', '撮って', '写真','カシャ'];
        const COOLDOWN_MS = 2000;
        const MAX_DIGITAL_ZOOM = 4.0;

        let recognition = null;
        let isListening = false;
        let lastShot = 0;
        let lastFiredIndex = -1;
        let stream = null;
        let track = null;
        let wakeLock = null;
        let lastBlob = null;
        let lastBlobUrl = null;

        let nativeZoom = null;
        let currentZoom = 1.0;
        let pinchStartDist = null;
        let pinchStartZoom = 1.0;
        let nativeApplying = false;
        let nativePending = null;

        // 映像全体が（縦画面でも横画面でも）切れずに収まるよう、枠のサイズを計算する
        function fitVideo() {
            const vw = video.videoWidth;
            const vh = video.videoHeight;
            if (!vw || !vh) return;

            const isLandscape = window.matchMedia('(orientation: landscape)').matches;
            const bodyStyle = getComputedStyle(document.body);
            const padX = parseFloat(bodyStyle.paddingLeft) + parseFloat(bodyStyle.paddingRight);
            const padY = parseFloat(bodyStyle.paddingTop) + parseFloat(bodyStyle.paddingBottom);
            const viewW = document.documentElement.clientWidth;
            const viewH = window.innerHeight;

            let availW, availH;
            if (isLandscape) {
                const panelW = panel.getBoundingClientRect().width || 170;
                availW = viewW - padX - panelW;
                availH = viewH - padY;
            } else {
                availW = Math.min(viewW - padX, 640);
                availH = (viewH - padY) * 0.45;
            }

            const s = Math.min(availW / vw, availH / vh);
            const w = Math.max(1, Math.floor(vw * s));
            const h = Math.max(1, Math.floor(vh * s));
            videoClip.style.width = w + 'px';
            videoClip.style.height = h + 'px';
            videoClip.style.aspectRatio = 'auto';
        }

        function onVideoSize() {
            updateResolutionInfo();
            fitVideo();
        }

        async function initCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: { ideal: 'environment' },
                        width: { ideal: 3840 },
                        height: { ideal: 2160 }
                    },
                    audio: false
                });
                video.srcObject = stream;
                track = stream.getVideoTracks()[0];
                detectNativeZoom();

                video.addEventListener('loadedmetadata', onVideoSize);
                video.addEventListener('resize', onVideoSize); // 画面回転で映像サイズが変わったとき
                if (video.readyState >= 1) onVideoSize();
            } catch (err) {
                alert('カメラへのアクセスが拒否されたか、利用できません。');
                console.error(err);
            }
        }

        function updateResolutionInfo() {
            resInfo.textContent = `${video.videoWidth}×${video.videoHeight}`;
        }

        function detectNativeZoom() {
            try {
                const caps = track.getCapabilities ? track.getCapabilities() : {};
                if (caps.zoom && typeof caps.zoom.max === 'number' && caps.zoom.max > caps.zoom.min) {
                    nativeZoom = { min: caps.zoom.min, max: caps.zoom.max };
                    zoomMode.textContent = '光学';
                    return;
                }
            } catch (e) {
                console.warn(e);
            }
            nativeZoom = null;
            zoomMode.textContent = 'デジタル';
        }

        function maxZoom() {
            return nativeZoom ? nativeZoom.max : MAX_DIGITAL_ZOOM;
        }
        function minZoom() {
            return nativeZoom ? nativeZoom.min : 1.0;
        }

        function setZoom(z) {
            z = Math.min(maxZoom(), Math.max(minZoom(), z));
            currentZoom = z;
            zoomBadge.textContent = '×' + z.toFixed(1);

            if (nativeZoom) {
                applyNativeZoom(z);
            } else {
                video.style.transform = `scale(${z})`;
            }

            zoomButtons.querySelectorAll('button').forEach(b => {
                b.classList.toggle('on', Math.abs(parseFloat(b.dataset.zoom) - z) < 0.05);
            });
        }

        async function applyNativeZoom(z) {
            if (nativeApplying) {
                nativePending = z;
                return;
            }
            nativeApplying = true;
            try {
                await track.applyConstraints({ advanced: [{ zoom: z }] });
            } catch (e) {
                console.warn('ネイティブズーム失敗:', e);
                nativeZoom = null;
                zoomMode.textContent = 'デジタル';
                video.style.transform = `scale(${Math.min(z, MAX_DIGITAL_ZOOM)})`;
            }
            nativeApplying = false;
            if (nativePending !== null && nativeZoom) {
                const next = nativePending;
                nativePending = null;
                applyNativeZoom(next);
            }
        }

        function getTouchDistance(touches) {
            const dx = touches[0].clientX - touches[1].clientX;
            const dy = touches[0].clientY - touches[1].clientY;
            return Math.sqrt(dx * dx + dy * dy);
        }

        function setupZoom() {
            videoWrapper.addEventListener('touchstart', (e) => {
                if (e.touches.length === 2) {
                    e.preventDefault();
                    pinchStartDist = getTouchDistance(e.touches);
                    pinchStartZoom = currentZoom;
                }
            }, { passive: false });

            videoWrapper.addEventListener('touchmove', (e) => {
                if (e.touches.length === 2 && pinchStartDist) {
                    e.preventDefault();
                    const ratio = getTouchDistance(e.touches) / pinchStartDist;
                    setZoom(pinchStartZoom * ratio);
                }
            }, { passive: false });

            const endPinch = (e) => {
                if (e.touches.length < 2) pinchStartDist = null;
            };
            videoWrapper.addEventListener('touchend', endPinch);
            videoWrapper.addEventListener('touchcancel', endPinch);

            ['gesturestart', 'gesturechange', 'gestureend'].forEach(name => {
                document.addEventListener(name, (e) => e.preventDefault(), { passive: false });
            });
            document.addEventListener('touchmove', (e) => {
                if (e.touches.length > 1) e.preventDefault();
            }, { passive: false });

            zoomButtons.addEventListener('click', (e) => {
                const btn = e.target.closest('button');
                if (btn) setZoom(parseFloat(btn.dataset.zoom));
            });

            videoWrapper.addEventListener('wheel', (e) => {
                e.preventDefault();
                setZoom(currentZoom + (e.deltaY < 0 ? 0.2 : -0.2));
            }, { passive: false });

            // 画面の向き・サイズが変わったら枠を再計算
            window.addEventListener('resize', fitVideo);
            window.addEventListener('orientationchange', () => {
                setTimeout(fitVideo, 150);
                setTimeout(fitVideo, 500); // iOSは回転直後にサイズが確定しないことがあるため再実行
            });
        }

        function takePhoto() {
            if (!video.videoWidth) return;

            const vw = video.videoWidth;
            const vh = video.videoHeight;
            const ctx = canvas.getContext('2d');

            if (!nativeZoom && currentZoom > 1.0) {
                const cw = Math.round(vw / currentZoom);
                const ch = Math.round(vh / currentZoom);
                const cx = Math.round((vw - cw) / 2);
                const cy = Math.round((vh - ch) / 2);
                canvas.width = cw;
                canvas.height = ch;
                ctx.drawImage(video, cx, cy, cw, ch, 0, 0, cw, ch);
            } else {
                canvas.width = vw;
                canvas.height = vh;
                ctx.drawImage(video, 0, 0, vw, vh);
            }

            canvas.toBlob((blob) => {
                if (!blob) return;
                if (lastBlobUrl) URL.revokeObjectURL(lastBlobUrl);
                lastBlob = blob;
                lastBlobUrl = URL.createObjectURL(blob);

                photoPreview.src = lastBlobUrl;
                photoInfo.textContent = `${canvas.width}×${canvas.height}px ／ ${(blob.size / 1024 / 1024).toFixed(1)}MB`;
                previewArea.style.display = 'flex';

                downloadLink.href = lastBlobUrl;
                downloadLink.download = `photo_${timestamp()}.jpg`;
            }, 'image/jpeg', 0.95);

            flash.classList.add('on');
            setTimeout(() => flash.classList.remove('on'), 100);
        }

        function closePreview() {
            previewArea.style.display = 'none';
        }

        function timestamp() {
            const d = new Date();
            const p = (n) => String(n).padStart(2, '0');
            return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
        }

        function setupShare() {
            if (!navigator.share || !navigator.canShare) return;
            const testFile = new File([new Blob(['x'], { type: 'image/jpeg' })], 'test.jpg', { type: 'image/jpeg' });
            if (!navigator.canShare({ files: [testFile] })) return;

            shareBtn.style.display = 'inline-block';
            shareBtn.addEventListener('click', async () => {
                if (!lastBlob) return;
                const file = new File([lastBlob], `photo_${timestamp()}.jpg`, { type: 'image/jpeg' });
                try {
                    await navigator.share({ files: [file] });
                } catch (e) {
                    if (e.name !== 'AbortError') console.error(e);
                }
            });
        }

        function setStoppedUI() {
            isListening = false;
            micStatus.textContent = '停止中';
            micIndicator.classList.remove('active');
            toggleMicBtn.textContent = '音声認識開始';
            toggleMicBtn.classList.remove('active');
        }

        function setupSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert('お使いのブラウザは音声認識に対応していません。');
                toggleMicBtn.style.display = 'none';
                return;
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'ja-JP';
            recognition.continuous = true;
            recognition.interimResults = true;

            recognition.onstart = () => {
                lastFiredIndex = -1;
            };

            recognition.onresult = (event) => {
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript.trim();
                    console.log('認識ワード:', transcript);

                    if (i === lastFiredIndex) continue;

                    const now = Date.now();
                    if (TRIGGER_WORDS.some(word => transcript.includes(word)) && now - lastShot > COOLDOWN_MS) {
                        lastShot = now;
                        lastFiredIndex = i;
                        takePhoto();
                    }
                }
            };

            recognition.onerror = (event) => {
                console.error('音声認識エラー:', event.error);
                if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
                    setStoppedUI();
                    alert('マイクまたは音声認識の使用が許可されていません。\n設定アプリでSafariのマイク許可と、「設定 > 一般 > キーボード > 音声入力」がオンか確認してください。');
                }
            };

            recognition.onend = () => {
                if (isListening) {
                    setTimeout(() => {
                        if (!isListening) return;
                        try {
                            recognition.start();
                        } catch (e) {
                            console.error(e);
                        }
                    }, 300);
                }
            };
        }

        toggleMicBtn.addEventListener('click', () => {
            if (!recognition) return;

            if (!isListening) {
                try {
                    recognition.start();
                    isListening = true;
                    micStatus.textContent = '待機中...';
                    micIndicator.classList.add('active');
                    toggleMicBtn.textContent = '音声認識停止';
                    toggleMicBtn.classList.add('active');
                } catch (e) {
                    console.error(e);
                }
            } else {
                setStoppedUI();
                recognition.stop();
            }
        });

        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (e) {
                console.warn('Wake Lock取得失敗:', e);
            }
        }
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') requestWakeLock();
        });

        window.addEventListener('pagehide', () => {
            if (stream) stream.getTracks().forEach(t => t.stop());
        });

        initCamera();
        setupZoom();
        setupShare();
        setupSpeechRecognition();
        requestWakeLock();
    </script>
</body>
</html>
